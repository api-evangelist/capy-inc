    x-apievangelist-note: >-
      Definition generated by the API Evangelist enrichment pipeline from
      Lemin's public developer documentation; the provider does not publish an
      OpenAPI definition.
- target: $.info
  update:
    x-artifacts:
      authentication: authentication/capy-inc-authentication.yml
      conventions: conventions/capy-inc-conventions.yml
      errors: errors/capy-inc-error-codes.yml
      data-model: data-model/capy-inc-data-model.yml
- target: $.paths['/captcha/v1/cropped/validate'].post
