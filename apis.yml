aid: capy-inc
name: Capy Inc.
description: >-
  Capy Inc. operates Lemin Captcha, a gamified bot-prevention and CAPTCHA
  service that replaces traditional image-selection challenges with playful,
  brandable puzzle games. Lemin protects websites and apps from automated
  attacks such as account takeover and credential stuffing while improving the
  human experience: the company reports puzzles are solved in roughly five
  seconds (versus eighteen for legacy CAPTCHAs) with far lower abandonment.
  Developers embed a client-side widget (available as first-party React,
  Angular, and Vue components on npm), then verify the visitor's encrypted
  answer server-side against the Lemin verification API using their account
  private key. Capy Inc. is a 500 Global portfolio company.
